<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async JavaScript</title>
    <style>
        h1{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        h2{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        div{
            text-align: center;
        }
        p{
            font-size: larger;
            font-family: Georgia, 'Times New Roman', Times, serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Project 1: Color Changing Webpage</h1>
    <div class="box">
        <button id="start">Start</button>
        : Start changing Color
        <br>
        <button id="stop">Stop</button>
        : Stop changing Color
    </div>
    <br>
    <br>
    <h2>Description -</h2>
    <p>
        This webpage changes its color every second.
    </p>
</body>
<script>
    const randomColor = function(){
        const colorString = "0123456789ABCDEF";
        let color = "#";
        for(let i = 0; i < 6; i++){
            let idx = Math.floor(Math.random()*16);
            color += colorString[idx];
        }
        return color;
    }

    let intervalId = null;
    function startrChangingColor(){
        function changeColor(){
            document.body.style.backgroundColor = randomColor();
        }
        if (!intervalId){
            intervalId = setInterval(changeColor,1000);
        }
    }

    document.querySelector("#start").addEventListener("click",startrChangingColor)

    function stopChangingColor(){
        clearInterval(intervalId);
        intervalId = null;
    }

    document.querySelector("#stop").addEventListener("click",stopChangingColor)
</script>
</html>
