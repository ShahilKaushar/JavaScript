<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color: aliceblue;">
    <h1>
        Old Heading
    </h1>
    <div id="box2">
        <button id="change">Change Heading</button>
        <span>: Changes The heading after 3 seconds</span>
        <br>
        <button id="stop">Dont't Change Heading</button>
        <span>: Doesn't lets the above button change the heading if pressed in between</span>
    </div>
</body>
<script>
    let changeElement = function() {
        let element = document.querySelector("h1");
        element.innerHTML = "New Heading";
    }
    let id = null;
    document.querySelector("#change").addEventListener("click",() => {
        id = setTimeout(changeElement,2000);
    })
    document.querySelector("#stop").addEventListener("click",() => {
        clearTimeout(id);
        id = null;
    })
</script>
</html>
