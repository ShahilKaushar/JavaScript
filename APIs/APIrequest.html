<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color: aliceblue; text-align: center; font-family: monospace;">
    <h1>Project: Github Profile</h1>
</body>
<script>
    const responseURL = "https://api.github.com/users/shahilkaushar";
    const xhr = new XMLHttpRequest();
    xhr.open("GET",responseURL);     
    xhr.send();

    xhr.onreadystatechange = function(){
        if(xhr.readyState === 4 && xhr.status === 200){
            const data = JSON.parse(this.responseText);
            name = data.name;
            profilePictureUrl = data.avatar_url;
            id = data.id;
            followers = data.followers;

            const h3 = document.createElement("h2");
            h3.innerHTML = `Name: ${name}`

            const img = document.createElement("img");
            img.src = profilePictureUrl;
            img.alt = "Profile Picture"
            img.style.borderRadius = "220px";

            const span1 = document.createElement("span");
            span1.innerHTML = `<h3>ID: ${id}</h3>`

            const span2 = document.createElement("span");
            span2.innerHTML = `<h3>Followers: ${followers}</h3>`;

            const div = document.createElement("div");
            div.appendChild(h3);
            div.appendChild(img);
            div.appendChild(span1);
            div.appendChild(span2);

            document.body.appendChild(div);
        }   
    }
</script>
</html>
